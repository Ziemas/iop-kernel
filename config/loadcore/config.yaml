name: loadcore
sha1: 3d072aa5fd2a9326676214cfaa0715e544ddfac6
options:
    # paths
    basename: loadcore
    target_path: in/LOADCORE.rom
    base_path: ../..
    
    asm_path: asm/loadcore
    src_path: src/loadcore
    asset_path: assets/loadcore
    build_path: build

    extensions_path: tools/splat_ext 
    symbol_addrs_path: config/loadcore/symbol_addrs.txt
    reloc_addrs_path: config/loadcore/reloc_addrs.txt
    undefined_funcs_auto_path: config/loadcore/undefined_funcs_auto.txt
    undefined_syms_auto_path:  config/loadcore/undefined_syms_auto.txt

    migrate_rodata_to_functions: True
    named_regs_for_c_funcs: False
    make_full_disasm_for_code: True
    make_full_disasm_for_hasm: True
    hasm_in_src_path: True

    gp_value: 0x9f40

    # compiler 
    compiler: GCC
    platform: psx

    string_encoding: ASCII
    
    section_order: [".text", ".rodata", ".data", ".bss"]

segments:
    - name: main
      type: code
      start: 0x0
      vram: 0x0
      bss_size: 0x74
      subsegments:
        # .text
        - [0x0, hasm, start]
        - [0x30, c, loadcore]
        - [0x1bf0, hasm, cache]
        - [0x1e40, asm, export_stub]
        - [0x1ed0, asm, import_stub]
        - [0x1f20, .rodata, loadcore]
        - [0x1f30, data, loadcore]

        # .sbss / .bss
        - { type: bss, vram: 0x1f50, name: loadcore }

    - [0x1f50]
        
