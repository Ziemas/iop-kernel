name: intrmani
sha1: 3d905b26cd09f3d3a9e5ee41a0d9d8a50ac8d67f
options:
    # paths
    basename: intrmani
    target_path: in/INTRMANI.rom
    base_path: ../..

    asm_path: asm/intrmani
    src_path: src/intrmani
    asset_path: assets/intrmani
    build_path: build

    extensions_path: tools/splat_ext
    symbol_addrs_path: config/intrmani/symbol_addrs.txt
    reloc_addrs_path: config/intrmani/reloc_addrs.txt
    undefined_funcs_auto_path: config/intrmani/undefined_funcs_auto.txt
    undefined_syms_auto_path:  config/intrmani/undefined_syms_auto.txt

    migrate_rodata_to_functions: True
    named_regs_for_c_funcs: False
    make_full_disasm_for_code: True
    hasm_in_src_path: True

    #gp_value: 0x9f40

    # compiler
    compiler: GCC
    platform: psx

    string_encoding: ASCII

    section_order: [".text", ".rodata", ".data", ".bss"]

segments:
    - name: main
      type: code
      start: 0x0
      vram: 0x0
      bss_size: 0x810
      subsegments:
        # .text
        - [0x0, c, intrman]
        # surprised if these aren't asm, but alignment doesn't work out
        #- [0x408, asm, syscall_wrapper]
        #- [0x458, c, unk458]
        - [0xd70, asm, unkd70]
        - [0x1480, asm, export_stub]
        - [0x1520, asm, import_stub]

        - [0x1570, .rodata, intrman]
        - [0x1590, data, intrman]

        # .sbss / .bss
        - { type: bss, vram: 0x15f0, name: intrman }

    - [0x15f0]
